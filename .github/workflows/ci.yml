name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  # Tests run entirely offline/in-process: SQLite in-memory DB, MockClassifier.
  # No external services are needed; no API keys are required.
  OPENAI_API_KEY: ""
  DATABASE_URL: "sqlite:///:memory:"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  ALERT_WEBHOOK_URL: ""
  ALERT_MIN_SEVERITY: "CRITICAL"
  ENVIRONMENT: "test"

jobs:
  test:
    name: Pytest – Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 src tests --max-line-length=120 --ignore=E203,W503 --count --statistics
        continue-on-error: true

      - name: Run Pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t incident-api:ci -f docker/api.Dockerfile .

      - name: Build worker image
        run: docker build -t incident-worker:ci -f docker/worker.Dockerfile .

      - name: Smoke-test API image
        run: |
          # Start the API container against a real PostgreSQL and Redis so
          # we can verify it actually starts. In a full staging environment
          # you would substitute a real service; here we just confirm the
          # image builds and the Python import graph is intact.
          docker run --rm \
            -e DATABASE_URL="sqlite:///:memory:" \
            -e REDIS_HOST="localhost" \
            -e OPENAI_API_KEY="" \
            --entrypoint python \
            incident-api:ci \
            -c "from src.api.main import app; print('API import OK')"
